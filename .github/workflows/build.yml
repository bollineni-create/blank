name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  model-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every model download link works
        run: |
          set -e
          python3 - <<'PY'
          import re, sys, urllib.request
          src = open("Loom/Services/LLMService.swift").read()
          pairs = re.findall(r'repo: "([^"]+)", file: "([^"]+)"', src)
          assert pairs, "no models found"
          bad = 0
          for repo, f in pairs:
              url = f"https://huggingface.co/{repo}/resolve/main/{f}"
              req = urllib.request.Request(url, method="HEAD")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      size = r.headers.get("Content-Length")
                      print("OK ", r.status, size, url)
              except Exception as e:
                  bad += 1
                  print("BAD", e, url)
          sys.exit(1 if bad else 0)
          PY

  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Loom-macOS
            destination: generic/platform=macOS
          - scheme: Loom-iOS
            destination: generic/platform=iOS
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Loom.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Loom/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
