name: Loom
options:
  bundleIdPrefix: com.personal.loom
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  preGenCommand: LlamaKit/fetch-llama.sh

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple ID team in Xcode > Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    # Loom doesn't use custom encryption, so TestFlight / App Store uploads skip the export-compliance question.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

packages:
  LlamaKit:
    path: LlamaKit

targetTemplates:
  LoomApp:
    type: application
    sources:
      - path: Loom
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Loom
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loom
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Loom imports photos you choose so it can read and organize them.
        INFOPLIST_KEY_NSCameraUsageDescription: Loom can capture photos and documents into your library.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Loom transcribes the videos you save, on this device, so it can summarize what they teach.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Loom-iOS:
    templates: [LoomApp]
    platform: iOS
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.loom.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Loom/Resources/Loom-iOS.entitlements
        INFOPLIST_FILE: Config/Loom-iOS-Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad apps must allow every orientation (App Store / TestFlight validation).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: LlamaKit
        product: LlamaKit
      - target: LoomShare-iOS

  Loom-macOS:
    templates: [LoomApp]
    platform: macOS
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.loom.mac
        CODE_SIGN_ENTITLEMENTS: Loom/Resources/Loom-macOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - package: LlamaKit
        product: LlamaKit
      - target: LoomShare-macOS

  # "Share → Loom" from any app. Saves into a shared inbox that Loom imports.
  LoomShare-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LoomShare
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.loom.ios.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/LoomShare-iOS-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Loom
        CODE_SIGN_ENTITLEMENTS: ShareExtension/LoomShare-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  LoomShare-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes: ["*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LoomShare
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.loom.mac.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/LoomShare-macOS-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Loom
        CODE_SIGN_ENTITLEMENTS: ShareExtension/LoomShare-macOS.entitlements
        SKIP_INSTALL: YES
